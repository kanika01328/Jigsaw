<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jigsaw Quiz</title>
<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
<h1>🧩 Jigsaw Quiz</h1>

<!-- Category Selection Screen -->
<div id="category-screen">
  <div class="modal">
    <h2>Choose Your Category</h2>
    <p class="category-subtitle">Select a topic to begin the quiz</p>
    <div id="category-list"></div>
  </div>
</div>

<!-- Name Entry Screen -->
<div id="name-screen" class="hidden">
  <div class="modal name-modal">
    <div class="name-header">
      <h2>👋 Welcome Player!</h2>
      <p>Please enter your name to start the game</p>
    </div>
    <input type="text" id="player-name" placeholder="Enter your name" maxlength="30" autocomplete="off">
    <div class="name-buttons">
      <button id="start-game-btn">🚀 Start Game</button>
      <button onclick="goBackToCategories()" class="back-btn">← Back to Categories</button>
    </div>
  </div>
</div>

<!-- Game Header - Now Center Aligned with Larger Font -->
<div id="game-header" class="hidden">
  <div class="game-header-container">
    <div id="player-info">Player: <span id="display-name"></span></div>
    <div id="scoreboard">Score: 0</div>
    <div id="timer">Time: 0s</div>
    <button id="change-category-btn" onclick="goBackToCategories()">
      ← Change Category
    </button>
  </div>
</div>

<!-- Game Container -->
<div id="game-container" class="hidden">
  <div id="jigsaw-wrapper">
    <div id="pieces"></div>
    <div id="board"></div>
  </div>
</div>

<!-- Question Box -->
<div id="question-box" class="hidden">
  <div class="modal question-modal">
    <h2>Answer to unlock!</h2>
    <p id="question-text"></p>
    <div id="options"></div>
    <button id="hint-btn">💡 Hint</button>
  </div>
</div>

<!-- Completion Box -->
<div id="reward-box" class="hidden">
  <div class="completion-modal">
    <img id="reward-image" src="" alt="Book Cover">
    <h2 id="completion-title">🎉 Quiz Completed!</h2>
    <p id="level-summary"></p>
    
    <!-- Integrated Leaderboard -->
    <div class="integrated-leaderboard">
      <h3>🏆 Leaderboard</h3>
      <ol id="completion-leaderboard-list"></ol>
    </div>
    
    <button onclick="restartGame()" class="play-again-btn">Play Again</button>
  </div>
</div>

<audio id="correct-sound" src="sounds/correct.mp3" preload="auto"></audio>
<audio id="wrong-sound" src="sounds/wrong.mp3" preload="auto"></audio>

<script src="script.js"></script>
</body>
</html>
